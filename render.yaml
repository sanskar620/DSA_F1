databases:
  - name: f1-strategyiq-db
    databaseName: f1_strategyiq
    plan: free

services:
  - type: web
    name: f1-strategyiq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_DIR
        value: models/v1
      - key: DATABASE_URL
        fromDatabase:
          name: f1-strategyiq-db
          property: connectionString
